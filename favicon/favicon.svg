<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A4A"/>
      <stop offset="100%" stop-color="#0F3D5F"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="18" y1="16" x2="46" y2="46">
      <stop offset="0%" stop-color="#33D6C4"/>
      <stop offset="100%" stop-color="#1AA6E0"/>
    </linearGradient>
  </defs>

  <!-- background badge -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- monogram A built from network/circuit lines -->
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- left leg of A -->
    <path d="M20 46 L31 16"/>
    <!-- right leg of A -->
    <path d="M44 46 L33 16"/>
    <!-- crossbar -->
    <path d="M25.5 34 L38.5 34"/>
  </g>

  <!-- network node dots at vertices to evoke infrastructure/telecom/AI -->
  <circle cx="32" cy="16" r="3.4" fill="#33D6C4"/>
  <circle cx="20" cy="46" r="3.4" fill="#1AA6E0"/>
  <circle cx="44" cy="46" r="3.4" fill="#1AA6E0"/>
</svg>
